<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="formGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2EFE9"/>
      <stop offset="100%" stop-color="#E1DDD3"/>
    </linearGradient>
    <linearGradient id="matteShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2B28"/>
      <stop offset="100%" stop-color="#191817"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#formGrad)"/>

  <!-- Minimal Blueprint grid lines -->
  <g opacity="0.15" stroke="#22221F" stroke-width="1">
    <circle cx="750" cy="400" r="280" fill="none"/>
    <circle cx="750" cy="400" r="180" fill="none" stroke-dasharray="4 6"/>
    <line x1="750" y1="80" x2="750" y2="720"/>
    <line x1="430" y1="400" x2="1070" y2="400"/>
  </g>

  <!-- Header meta -->
  <text x="80" y="70" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="4" fill="#6B6760">STUDIO ARCHIVE / VOL 03</text>
  <text x="1120" y="70" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#88837A" text-anchor="end">FICTITIOUS CONCEPT</text>

  <!-- Typography Left Column -->
  <g transform="translate(80, 260)">
    <text x="0" y="40" font-family="'Cinzel', Georgia, serif" font-size="76" font-weight="600" fill="#22221F" letter-spacing="4">FORM</text>
    <text x="0" y="110" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="300" fill="#5E5A53">Everyday Objects</text>
    <rect x="0" y="140" width="80" height="3" fill="#22221F"/>

    <text x="0" y="210" font-family="system-ui, sans-serif" font-size="16" fill="#54514A">
      <tspan x="0" dy="0">High-end industrial design studies re-imagined through</tspan>
      <tspan x="0" dy="28">generative procedural form and tactile lighting.</tspan>
    </text>

    <g transform="translate(0, 360)">
      <text x="0" y="0" font-family="system-ui, sans-serif" font-size="11" letter-spacing="3" fill="#847E74" font-weight="700">EXPERIMENT</text>
      <text x="0" y="24" font-family="system-ui, sans-serif" font-size="15" fill="#22221F" font-weight="500">Material Tactility &amp; Caustics</text>

      <text x="300" y="0" font-family="system-ui, sans-serif" font-size="11" letter-spacing="3" fill="#847E74" font-weight="700">TOOLS</text>
      <text x="300" y="24" font-family="system-ui, sans-serif" font-size="15" fill="#22221F" font-weight="500">Midjourney v6 / Blender / Custom Lora</text>
    </g>
  </g>

  <!-- Sculpture Composition Right -->
  <g transform="translate(750, 400)">
    <!-- Base block -->
    <polygon points="-120,180 80,180 140,240 -60,240" fill="#CEC7BA"/>
    <!-- Heavy monolith -->
    <rect x="-100" y="-120" width="90" height="280" rx="6" fill="url(#matteShadow)"/>
    <!-- Glass/translucent sphere -->
    <circle cx="60" cy="40" r="100" fill="#E8F4F8" fill-opacity="0.75" stroke="#B8D0D8" stroke-width="2"/>
    <ellipse cx="40" cy="0" rx="30" ry="12" fill="#FFFFFF" fill-opacity="0.8" transform="rotate(-30 40 0)"/>
    <!-- Accent golden brass ring -->
    <ellipse cx="20" cy="-60" rx="90" ry="24" fill="none" stroke="#C2A878" stroke-width="8" transform="rotate(-20 20 -60)"/>
  </g>
</svg>
