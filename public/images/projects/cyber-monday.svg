<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141517"/>
      <stop offset="60%" stop-color="#202225"/>
      <stop offset="100%" stop-color="#2a2d32"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C7F36B"/>
      <stop offset="100%" stop-color="#9DE538"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#cyberBg)"/>
  
  <!-- Grid layout elements -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="800"/>
    <line x1="1120" y1="0" x2="1120" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
  </g>

  <!-- Editorial Typography & Badge -->
  <text x="80" y="110" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#C7F36B">AURA STUDIO / ARCHIVE 01</text>
  <rect x="80" y="130" width="160" height="2" fill="#C7F36B"/>
  
  <rect x="940" y="85" width="180" height="34" rx="17" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <text x="1030" y="107" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#A5A5A0" text-anchor="middle">FICTITIOUS CONCEPT</text>

  <!-- Abstract Tech Devices & Spatial Shapes -->
  <g transform="translate(620, 240)">
    <!-- Device Backing Frame -->
    <rect x="0" y="40" width="460" height="340" rx="28" fill="#1C1E22" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
    <rect x="30" y="70" width="400" height="280" rx="16" fill="#111215" stroke="rgba(199,243,107,0.3)" stroke-width="1"/>
    <!-- Interface Wave/Chart Mock -->
    <path d="M 60 280 C 130 180, 200 320, 280 200 C 340 120, 390 220, 410 170" fill="none" stroke="url(#accentGlow)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="280" cy="200" r="7" fill="#C7F36B"/>
    <circle cx="280" cy="200" r="18" fill="none" stroke="rgba(199,243,107,0.4)" stroke-width="2"/>
    <!-- Floating Minimal Ring -->
    <circle cx="430" cy="30" r="85" fill="none" stroke="#C7F36B" stroke-width="1.5" stroke-dasharray="8 12"/>
  </g>

  <!-- Left Hero Details -->
  <text x="80" y="340" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="68" font-weight="500" fill="#FFFFFF" letter-spacing="-1">Cyber Monday</text>
  <text x="80" y="420" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="300" fill="#E2E2DF" letter-spacing="1">Tech Edit — 2026</text>
  
  <text x="80" y="490" font-family="system-ui, sans-serif" font-size="17" fill="#999891" width="480">
    <tspan x="80" dy="0">A high-precision visual campaign exploring artificial</tspan>
    <tspan x="80" dy="28">lighting, tactile tech materials, and futuristic minimalism.</tspan>
  </text>

  <!-- Spec details -->
  <g transform="translate(80, 640)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="11" letter-spacing="3" fill="#6E6E69" font-weight="700">FORMAT</text>
    <text x="0" y="24" font-family="system-ui, sans-serif" font-size="15" fill="#FFFFFF" font-weight="500">Omnichannel &amp; 3D Billboards</text>

    <text x="320" y="0" font-family="system-ui, sans-serif" font-size="11" letter-spacing="3" fill="#6E6E69" font-weight="700">AI PIPELINE</text>
    <text x="320" y="24" font-family="system-ui, sans-serif" font-size="15" fill="#C7F36B" font-weight="500">ComfyUI / Midjourney v6 / Upscale</text>
  </g>
</svg>
