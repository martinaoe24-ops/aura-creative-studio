<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="socialBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E1C"/>
      <stop offset="100%" stop-color="#121211"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D6FA85"/>
      <stop offset="100%" stop-color="#B2E74E"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#socialBg)"/>

  <!-- Top bar -->
  <text x="80" y="60" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="4" fill="#C7F36B">CAMPAIGN SYSTEM / MULTI-RATIO</text>
  <text x="1120" y="60" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#75756E" text-anchor="end">FICTITIOUS CONCEPT</text>

  <!-- Left Header -->
  <g transform="translate(80, 160)">
    <text x="0" y="50" font-family="'Cinzel', Georgia, serif" font-size="64" font-weight="500" fill="#FFFFFF" letter-spacing="-0.5">Social Campaign</text>
    <text x="0" y="120" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="300" fill="#C7F36B" letter-spacing="0">Toolkit 2026</text>
    
    <text x="0" y="180" font-family="system-ui, sans-serif" font-size="16" fill="#A8A8A0">
      <tspan x="0" dy="0">High-velocity multi-format campaign modular design system,</tspan>
      <tspan x="0" dy="28">blending dynamic typography with synthetic editorial art.</tspan>
    </text>

    <!-- Mini Spec Badges -->
    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="130" height="34" rx="6" fill="#2A2A26"/>
      <text x="65" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#EAEAE5" text-anchor="middle">9:16 Stories</text>

      <rect x="145" y="0" width="130" height="34" rx="6" fill="#2A2A26"/>
      <text x="210" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#EAEAE5" text-anchor="middle">4:5 Feed</text>

      <rect x="290" y="0" width="130" height="34" rx="6" fill="#2A2A26"/>
      <text x="355" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#EAEAE5" text-anchor="middle">16:9 Banner</text>
    </g>

    <g transform="translate(0, 480)">
      <text x="0" y="0" font-family="system-ui, sans-serif" font-size="11" letter-spacing="3" fill="#6B6B64" font-weight="700">OUTPUT</text>
      <text x="0" y="24" font-family="system-ui, sans-serif" font-size="15" fill="#FFFFFF" font-weight="500">60+ Modular Creative Assets</text>
    </g>
  </g>

  <!-- Right Visual Mockups: 3 Phone/Asset aspect ratio cards -->
  <g transform="translate(680, 150)">
    <!-- 9:16 Vertical Story Mockup -->
    <rect x="160" y="0" width="260" height="480" rx="24" fill="#252522" stroke="#3D3D36" stroke-width="2"/>
    <rect x="175" y="15" width="230" height="450" rx="16" fill="#171715"/>
    <!-- Mockup Inner Art -->
    <circle cx="290" cy="180" r="70" fill="url(#limeGrad)" opacity="0.9"/>
    <rect x="200" y="300" width="180" height="14" rx="3" fill="#FFFFFF"/>
    <rect x="200" y="325" width="120" height="10" rx="3" fill="#6E6E67"/>
    <rect x="200" y="390" width="180" height="40" rx="20" fill="#C7F36B"/>
    <text x="290" y="415" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#121211" text-anchor="middle">DISCOVER NOW</text>

    <!-- 4:5 Card Mockup Floating Behind -->
    <rect x="20" y="120" width="220" height="280" rx="16" fill="#2E2E2A" stroke="#484840" stroke-width="2"/>
    <rect x="35" y="135" width="190" height="170" rx="10" fill="#383832"/>
    <polygon points="130,165 190,265 70,265" fill="#C7F36B" opacity="0.8"/>
    <rect x="35" y="325" width="140" height="12" rx="3" fill="#F0F0EA"/>
    <rect x="35" y="350" width="90" height="8" rx="2" fill="#7E7E75"/>
  </g>
</svg>
