<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Página no encontrada | AURA Creative Studio</title>
  <link rel="icon" type="image/svg+xml" href="/public/favicon/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .not-found-wrap {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .not-found-num {
      font-family: var(--font-serif);
      font-size: clamp(6rem, 15vw, 12rem);
      line-height: 1;
      color: var(--color-text-primary);
      opacity: 0.15;
    }
    .not-found-title {
      font-family: var(--font-serif);
      font-size: 2.25rem;
      margin-top: -2rem;
      margin-bottom: 1rem;
    }
    .not-found-desc {
      color: var(--color-text-secondary);
      max-width: 480px;
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
  <div class="not-found-wrap">
    <div class="not-found-num">404</div>
    <h1 class="not-found-title">Página no encontrada / Page not found</h1>
    <p class="not-found-desc">
      El archivo o proyecto solicitado no existe en el archivo del estudio. / The requested archive item does not exist.
    </p>
    <a href="/" class="btn btn-primary">Volver al Inicio / Return Home</a>
  </div>
</body>
</html>
